# The five server shards, one per line. Read by tf-shard at run time and by the
# Dockerfile when it generates the s6 service tree, so this file is the single
# place a shard is added, removed or repointed.
#
#   name   port   dats(tier)  cfg              map       flags
#
# dats     which tier of qwprogs/csprogs/menu the shard runs: master is the
#          released set, staging is what the updater pulls from the staging
#          prefix. Symlinked into the shard's homedir, which FTE searches
#          before the shared basedir, so the tier shadows the image's copy.
# flags    "password" locks the shard with $TF_PASSWORD. "-" for none.
# channel  Discord channel override; "-" uses $TF_DISCORD_CHANNEL_ID.
#
# name     port   dats     cfg               map       flags     channel
pub        27500  master   fo_pubmode.cfg    2fort5r   -         -
duel       27501  staging  fo_duelmode.cfg   1on1r     -         -
tourney    27504  master   fo_quadmode.cfg   2fort5r   password  1026405619231625257
scrim      27505  staging  fo_quadmode.cfg   2fort5r   password  1147341454851719219
staging    27510  staging  fo_quadmode.cfg   2fort5r   -         -
