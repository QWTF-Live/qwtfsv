timelimit 20
fraglimit 0
localinfo clan off
localinfo quadmode off
localinfo duelmode off
localinfo teamfrags off
localinfo sniperreload off
localinfo stock_on_cap off
maxclients 24

localinfo cr_scout              0               // restrict scouts (-1 = disallow, 0 = allow, 1+ = restrict to n)
